[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neuratal-tokenizer"
version = "0.3.0"
description = "Multilingual byte-level BPE tokenizer (NTokenizer) — Python bindings to the Rust engine"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT OR Apache-2.0"}
authors = [{name = "Neuratal Tokenizer Contributors"}]

[tool.setuptools]
# Single-module package: the directory itself is the package.
# Build/install requires the native library (see ../README.md, "Build").
packages = ["neuratal_tokenizer"]
